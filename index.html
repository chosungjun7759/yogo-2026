<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연희노인복지관 AI 안내 (2026)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fff7ed; }
        .chat-bubble { white-space: pre-wrap; word-break: break-word; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* 👇👇👇 API 키 입력 (따옴표 필수!) 👇👇👇 */
        const API_KEY = "AIzaSyDNfCYQySX_03KZjWg03A9r75w6hnV8dMk"; 

        const SYSTEM_PROMPT = `
당신은 서대문구 '연희노인복지관'의 AI 안내원입니다.
어르신들께 예의 바르고 친절하게 존댓말(합니다/해요체)로 답변하세요.

[핵심 정보: 2026년 청춘교실]
- 기간: 2026년 1월 ~ 6월 (6개월간)
- 수강료: 과목당 월 4,000원 (6개월치 24,000원 일시납)
- 접수: 본인 직접 방문 필수 (신분증 지참, 대리접수 불가)
- 문의: 02-3143-7778

[요일별 시간표]
* 월: 라인댄스(10시), 칼림바(10시), 오카리나 초급(15시)
* 화: 요가(10시), 생활영어(10시), 스포츠댄스(14시), 수채화(14시)
* 수: 맷돌체조(09:15), 캘리그라피(10시), 단학기공(10:40)
* 목: 노래교실(10시), 영어Grammar(13시), 소도구필라테스(14시), 오카리나 중급(16시)
* 금: 스마트폰 초급(09:30), 스마트폰 중급(11:00), 색연필드로잉(13:30)

[할인 혜택]
- 50% 감면: 기초생활수급자, 장애인, 국가유공자
- 20% 감면: 차상위계층
`;

        function App() {
            const [messages, setMessages] = useState([
                { role: 'assistant', text: '안녕하세요 어르신! 🙇‍♂️\n2026년도 프로그램 시간표와 수강료를 안내해 드릴까요?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                scrollRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim()) return;
                
                const userMsg = input;
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setInput('');
                setLoading(true);

                try {
                    // ✅ 모델 이름을 'gemini-1.5-flash'로 복귀 (이게 정답입니다!)
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `System: ${SYSTEM_PROMPT}\nUser: ${userMsg}` }] }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        // 에러가 나면 상세 내용을 보여줍니다
                        throw new Error(data.error?.message || "통신 오류");
                    }

                    const aiMsg = data?.candidates?.[0]?.content?.parts?.[0]?.text || "죄송합니다. 답변을 만들지 못했습니다.";
                    setMessages(prev => [...prev, { role: 'assistant', text: aiMsg }]);

                } catch (error) {
                    console.error(error);
                    setMessages(prev => [...prev, { role: 'assistant', text: `[오류 해결] 잠시 후 다시 시도해주세요.\n(${error.message})` }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white border-x border-orange-200 shadow-2xl">
                    <div className="bg-orange-600 p-4 text-white text-center shadow-md z-10">
                        <h1 className="text-xl font-bold">연희노인복지관 (2026)</h1>
                        <p className="text-xs text-orange-100 mt-1">무엇이든 물어보세요 🧡</p>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#fff7ed] scrollbar-hide">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-lg shadow-sm chat-bubble ${
                                    msg.role === 'user' 
                                    ? 'bg-yellow-300 text-gray-900 rounded-tr-none' 
                                    : 'bg-white border border-orange-100 text-gray-800 rounded-tl-none'
                                }`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-center text-orange-500 text-sm animate-pulse">답변 작성 중... 🖊️</div>}
                        <div ref={scrollRef} />
                    </div>

                    <div className="p-3 bg-white border-t border-orange-100 flex gap-2">
                        <input 
                            type="text" 
                            className="flex-1 p-3 border border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 text-lg"
                            placeholder="질문하기..."
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                        />
                        <button 
                            onClick={handleSend}
                            className="bg-orange-600 text-white px-5 rounded-xl font-bold hover:bg-orange-700 transition-colors"
                        >
                            전송
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
