<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연희노인복지관 AI 안내 (스마트 연결)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fff7ed; }
        .chat-bubble { white-space: pre-wrap; word-break: break-word; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* 👇👇👇 API 키 입력 (따옴표 필수!) 👇👇👇 */
        const API_KEY = "AIzaSyCDbLs06o3fFHpmuKphXNs3v7qXVxAkjVs"; 

        const SYSTEM_PROMPT = `
당신은 서대문구 '연희노인복지관'의 AI 안내원입니다.
어르신들께 예의 바르고 친절하게 존댓말(합니다/해요체)로 답변하세요.

[핵심 정보: 2026년 청춘교실]
- 기간: 2026년 1월 ~ 6월
- 수강료: 과목당 월 4,000원
- 문의: 02-3143-7778
[시간표]
월: 라인댄스(10시), 칼림바(10시)
화: 요가(10시), 생활영어(10시)
수: 맷돌체조(9:15), 캘리그라피(10시)
목: 노래교실(10시), 영어(13시)
금: 스마트폰(9:30)
`;

        function App() {
            const [messages, setMessages] = useState([
                { role: 'assistant', text: '안녕하세요! 복지관 안내를 도와드릴까요? (모델 찾는 중...)' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [activeModel, setActiveModel] = useState(null); // 사용 가능한 모델 이름 저장
            const scrollRef = useRef(null);

            // 1. 앱이 켜지면 사용 가능한 모델을 스스로 찾습니다!
            useEffect(() => {
                const findModel = async () => {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                        const data = await res.json();
                        
                        if (data.models) {
                            // 'generateContent' 기능이 있는 'gemini' 모델 하나를 찾아서 선택
                            const validModel = data.models.find(m => 
                                m.name.includes('gemini') && 
                                m.supportedGenerationMethods.includes('generateContent')
                            );

                            if (validModel) {
                                setActiveModel(validModel.name);
                                setMessages(prev => [{ role: 'assistant', text: `✅ 연결 성공! (${validModel.name} 모델 사용)\n무엇이든 물어보세요!` }]);
                            } else {
                                setMessages(prev => [{ role: 'assistant', text: '❌ 사용 가능한 모델을 찾지 못했습니다. API 키 권한을 확인해주세요.' }]);
                            }
                        } else {
                            throw new Error(data.error?.message || "모델 목록 불러오기 실패");
                        }
                    } catch (e) {
                        setMessages(prev => [{ role: 'assistant', text: `⚠️ 초기화 오류: ${e.message}\n(API 키가 정확한지 확인해주세요)` }]);
                    }
                };
                findModel();
            }, []);

            useEffect(() => {
                scrollRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim() || !activeModel) return;
                
                const userMsg = input;
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setInput('');
                setLoading(true);

                try {
                    // 2. 찾아낸 모델 이름(activeModel)을 그대로 사용
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `System: ${SYSTEM_PROMPT}\nUser: ${userMsg}` }] }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || "응답 실패");
                    }

                    const aiMsg = data?.candidates?.[0]?.content?.parts?.[0]?.text || "죄송합니다. 답변이 없습니다.";
                    setMessages(prev => [...prev, { role: 'assistant', text: aiMsg }]);

                } catch (error) {
                    setMessages(prev => [...prev, { role: 'assistant', text: `오류: ${error.message}` }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white border-x border-orange-200 shadow-2xl">
                    <div className="bg-orange-600 p-4 text-white text-center shadow-md z-10">
                        <h1 className="text-xl font-bold">연희노인복지관 AI</h1>
                        <p className="text-xs text-orange-100 mt-1">
                            {activeModel ? "🟢 연결됨" : "🔴 연결 중..."}
                        </p>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#fff7ed] scrollbar-hide">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-lg shadow-sm chat-bubble ${
                                    msg.role === 'user' 
                                    ? 'bg-yellow-300 text-gray-900 rounded-tr-none' 
                                    : 'bg-white border border-orange-100 text-gray-800 rounded-tl-none'
                                }`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-center text-orange-500 text-sm animate-pulse">답변 작성 중... 🖊️</div>}
                        <div ref={scrollRef} />
                    </div>

                    <div className="p-3 bg-white border-t border-orange-100 flex gap-2">
                        <input 
                            type="text" 
                            className="flex-1 p-3 border border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 text-lg"
                            placeholder={activeModel ? "질문하세요" : "연결 중입니다..."}
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                            disabled={!activeModel} 
                        />
                        <button 
                            onClick={handleSend}
                            disabled={!activeModel}
                            className={`px-5 rounded-xl font-bold text-white transition-colors ${activeModel ? 'bg-orange-600 hover:bg-orange-700' : 'bg-gray-400'}`}
                        >
                            전송
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
